name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ALLOW_SQLITE: "true"
      STOCK_SCANNER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r service/requirements.txt
      - name: Backend tests
        run: python -m pytest service/server/tests --ignore=service/server/tests/test_stock_scanner.py -q
      - name: Stock scanner tests (providers mocked)
        run: python -m pytest service/server/tests/test_stock_scanner.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: service/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix service/frontend
      - name: Build frontend
        run: npm --prefix service/frontend run build
