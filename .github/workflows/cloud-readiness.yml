name: Cloud readiness (no deployment)
on:
  pull_request:
  push:
    branches: [main, 'codex/cloud-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: service/frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: service/frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cloud_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ai_trader_cloud_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cloud_test -d ai_trader_cloud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://cloud_test:disposable-ci-only@127.0.0.1:5432/ai_trader_cloud_test
      STOCK_SCANNER_ENABLED: "false"
      TELEGRAM_NEWS_STREAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r service/requirements.txt -r service/requirements-telegram-reader.txt
      - name: PostgreSQL client and encryption tools
        # https://www.postgresql.org/download/linux/ubuntu/ (official PGDG key)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
      - name: Real PostgreSQL lifecycle, snapshot, concurrency, encrypted restore
        run: python -m pytest service/server/tests_pg -q
      - name: Backend and scanner regression
        run: python -m pytest service/server/tests -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image (no push or deploy)
        run: docker build -t ai-trader:readiness .
      - name: Compile image modules as non-root
        run: docker run --rm --entrypoint python ai-trader:readiness -c "import config,database,ai_provider,cloud_runtime,active_snapshot,scanner_engine; print('imports OK')"
