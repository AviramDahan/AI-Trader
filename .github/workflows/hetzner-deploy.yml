name: Deploy backend to Hetzner
on:
  workflow_run:
    workflows: ['Cloud readiness (no deployment)']
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
concurrency:
  group: hetzner-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require CI success for the exact same commit
        timeout-minutes: 11
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            for (let n=0;n<60;n++) {
              const r = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha:sha, branch:'main', event:'push', per_page:100});
              const ci=r.data.workflow_runs.find(x=>x.name==='CI');
              if(ci?.conclusion==='success') return;
              if(ci?.status==='completed') throw new Error('CI did not pass');
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('CI not complete; no deployment');
      - name: Verify server pull-deployment and all-role readiness marker
        timeout-minutes: 28
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request
          sha=os.environ['SHA']
          # Polling deadline, not a hard DNS/TLS whole-call deadline. The step
          # timeout is the backstop. Cover 5m timer + 20m service + 2m margin.
          deadline=time.monotonic()+27*60
          max_body_bytes=16*1024
          verified=False
          while True:
              remaining=deadline-time.monotonic()
              if remaining<=0:
                  break
              try:
                  with urllib.request.urlopen('https://2-28-100-77.sslip.io/health',timeout=min(10,remaining)) as r:
                      status=r.status
                      raw=r.read(max_body_bytes+1)
                  if time.monotonic()>=deadline:
                      break
                  if status==200 and len(raw)<=max_body_bytes:
                      data=json.loads(raw)
                      if (isinstance(data,dict) and data.get('build_sha')==sha
                              and data.get('deployed_sha')==sha and time.monotonic()<deadline):
                          verified=True
                          print('Backend deployment and all-role readiness PASS:',sha)
                          break
              except Exception:
                  pass
              remaining=deadline-time.monotonic()
              if remaining<=0:
                  break
              time.sleep(min(10,remaining))
          if not verified:
              raise SystemExit('Deployment not verified; inspect server deployment service. No success assumed.')
          PY
