name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/frontend/package-lock.json
      - name: Build original React frontend
        working-directory: service/frontend
        env:
          VITE_API_BASE: ${{ vars.BACKEND_URL }}/api
          PUBLIC_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          npm ci
          npm run build -- --base /AI-Trader/
          cp dist/index.html dist/404.html
          mkdir -p dist/market
          cp dist/index.html dist/market/index.html
          touch dist/.nojekyll
          jq -n --arg url "$PUBLIC_BACKEND_URL" '{backend_url: $url}' > dist/runtime-config.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: service/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
